<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<link rel="stylesheet" type="text/css" href="csc.css">
<body>
   <div class="calculator">
        <div class="display">
            <div class="previous">123 +</div>
            <div class="current">456</div>
        </div>
        <div class="buttons">
            <button class="operator">AC</button>
            <button class="operator">DEL</button>
            <button class="operator">%</button>
            <button class="operator">÷</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">×</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
            <button class="span-2">0</button>
            <button>.</button>
            <button class="operator">=</button>
        </div>
    </div>
    
</body>
</html>
